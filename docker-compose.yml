version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optifleet_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://optifleet:secret@db:5432/optifleet?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme_in_production}
      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-optifleet_jwt_passphrase}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAILER_DSN: ${MAILER_DSN:-null://null}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - optifleet_network

  db:
    image: postgres:16-alpine
    container_name: optifleet_db
    environment:
      POSTGRES_DB: optifleet
      POSTGRES_USER: optifleet
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optifleet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - optifleet_network

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: optifleet_front
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
    networks:
      - optifleet_network

volumes:
  pgdata:

networks:
  optifleet_network:
    driver: bridge
